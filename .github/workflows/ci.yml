name: Kamba Mobile CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Align Expo packages with the selected SDK
        run: npx expo install --fix
      - name: Report dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name, item] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name, severity:item.severity, range:item.range, fixAvailable:item.fixAvailable}))"
          npm audit --audit-level=high
      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: mobile-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Validate Expo dependencies
        run: npx expo-doctor
      - name: Export Android bundle
        run: npx expo export --platform android
        env:
          EXPO_PUBLIC_API_URL: https://api.kamba.ng
      - name: Commit SDK-aligned dependency lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(mobile): align Expo SDK dependency lockfile'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
