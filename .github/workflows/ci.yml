name: Kamba Mobile CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply compatible dependency security updates
        run: npm audit fix
      - name: Report dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name, item] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name, severity:item.severity, range:item.range, fixAvailable:item.fixAvailable}))"
          npm audit --audit-level=high
      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: mobile-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Validate Expo dependencies
        run: npx expo-doctor
      - name: Export Android bundle
        run: npx expo export --platform android
        env:
          EXPO_PUBLIC_API_URL: https://api.kamba.ng
